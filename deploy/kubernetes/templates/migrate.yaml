{{- if .Values.controller.enabled }}
{{- $imageTag := default .Chart.AppVersion .Values.image.tag -}}
{{- $relayImage := printf "%s:%s" .Values.image.repository $imageTag -}}
{{- if .Values.image.digest -}}
{{- $relayImage = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: vrrelay-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ $relayImage | quote }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          args: ['node', 'apps/relay/dist/main.js', 'migrate']
          env:
            - { name: VRRELAY_ENVIRONMENT, value: production }
            - { name: VRRELAY_PUBLIC_URL, value: {{ .Values.controller.publicUrl | quote }} }
            - name: VRRELAY_TRUSTED_PROXY_CIDRS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.controller | quote }}
                  key: VRRELAY_TRUSTED_PROXY_CIDRS
            - { name: VRRELAY_NODE_ROLES, value: controller }
            - { name: VRRELAY_DATA_DIR, value: /var/lib/vrrelay }
            - { name: VRRELAY_REPOSITORY_DRIVER, value: postgres }
            - name: VRRELAY_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.controller | quote }}
                  key: VRRELAY_POSTGRES_URL
          envFrom: [{ secretRef: { name: {{ .Values.secrets.controller | quote }} } }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/vrrelay }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
{{- end }}
