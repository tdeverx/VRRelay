openapi: 3.1.0
info:
  title: VRRelay API
  version: 1.0.0
  description: Administrative, cluster-enrollment, and event API for a private VRRelay installation.
  license: { name: GPL-3.0-or-later }
servers: [{ url: /api/v1 }]
security: [{ cookieSession: [] }, { personalToken: [] }]
tags:
  - { name: System }
  - { name: Authentication }
  - { name: Providers }
  - { name: Profiles }
  - { name: Sessions }
  - { name: Live }
  - { name: Cluster }
  - { name: Operations }

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /setup:
    get:
      operationId: getSetupStatus
      tags: [Authentication]
      security: []
      responses:
        '200': { $ref: '#/components/responses/SetupStatus' }
    post:
      operationId: initializeAdmin
      tags: [Authentication]
      security: []
      requestBody: { $ref: '#/components/requestBodies/FirstRun' }
      responses:
        '201': { $ref: '#/components/responses/SetupStatus' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      security: []
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Error' }

  /providers:
    get:
      operationId: listProviders
      tags: [Providers]
      responses:
        '200': { $ref: '#/components/responses/ProviderList' }
    post:
      operationId: createProvider
      tags: [Providers]
      requestBody: { $ref: '#/components/requestBodies/CreateProvider' }
      responses:
        '201': { $ref: '#/components/responses/Provider' }
        '400': { $ref: '#/components/responses/Error' }
  /providers/{providerId}/validate:
    post:
      operationId: validateProvider
      tags: [Providers]
      parameters: [{ $ref: '#/components/parameters/ProviderId' }]
      responses:
        '204': { description: Provider validated }
        '404': { $ref: '#/components/responses/Error' }
  /providers/{providerId}:
    delete:
      operationId: deleteProvider
      tags: [Providers]
      parameters: [{ $ref: '#/components/parameters/ProviderId' }]
      responses:
        '204': { description: Provider and its local credential were deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /providers/{providerId}/catalog:
    get:
      operationId: browseCatalog
      tags: [Providers]
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
        - { name: parentId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: kinds, in: query, schema: { type: array, items: { type: string } } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Catalog' }
  /providers/{providerId}/items/{itemId}:
    get:
      operationId: getProviderItem
      tags: [Providers]
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200': { $ref: '#/components/responses/MediaItem' }
        '404': { $ref: '#/components/responses/Error' }

  /profiles:
    get:
      operationId: listProfiles
      tags: [Profiles]
      responses:
        '200': { $ref: '#/components/responses/ProfileList' }
    post:
      operationId: createProfileRevision
      tags: [Profiles]
      requestBody: { $ref: '#/components/requestBodies/CreateProfileRevision' }
      responses:
        '201': { $ref: '#/components/responses/Profile' }
  /capabilities:
    get:
      operationId: getMediaCapabilities
      tags: [Profiles]
      responses:
        '200': { $ref: '#/components/responses/MediaCapabilities' }

  /sessions:
    get:
      operationId: listSessions
      tags: [Sessions]
      responses:
        '200': { $ref: '#/components/responses/SessionList' }
    post:
      operationId: createSession
      tags: [Sessions]
      requestBody: { $ref: '#/components/requestBodies/CreateSession' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '409': { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [Sessions]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: controlSession
      tags: [Sessions]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody: { $ref: '#/components/requestBodies/ControlSession' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
    delete:
      operationId: deleteSession
      tags: [Sessions]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { description: Session deleted }

  /live-channels:
    get:
      operationId: listLiveChannels
      tags: [Live]
      responses:
        '200': { $ref: '#/components/responses/LiveChannelList' }
    post:
      operationId: createLiveChannel
      tags: [Live]
      requestBody: { $ref: '#/components/requestBodies/CreateLiveChannel' }
      responses:
        '201': { $ref: '#/components/responses/CreatedLiveChannel' }
  /live-channels/{channelId}:
    delete:
      operationId: deleteLiveChannel
      tags: [Live]
      parameters: [{ $ref: '#/components/parameters/ChannelId' }]
      responses:
        '204': { description: Live channel deleted }

  /compatibility:
    get:
      operationId: listCompatibilityResults
      tags: [Operations]
      responses:
        '200': { $ref: '#/components/responses/CompatibilityList' }
    post:
      operationId: recordCompatibilityResult
      tags: [Operations]
      requestBody: { $ref: '#/components/requestBodies/CompatibilityResult' }
      responses:
        '201': { $ref: '#/components/responses/Compatibility' }
  /tokens:
    get:
      operationId: listPersonalTokens
      tags: [Authentication]
      responses:
        '200': { $ref: '#/components/responses/TokenList' }
    post:
      operationId: createPersonalToken
      tags: [Authentication]
      requestBody: { $ref: '#/components/requestBodies/CreatePersonalToken' }
      responses:
        '201': { $ref: '#/components/responses/CreatedToken' }
  /tokens/{tokenId}:
    delete:
      operationId: revokePersonalToken
      tags: [Authentication]
      parameters: [{ $ref: '#/components/parameters/TokenId' }]
      responses:
        '204': { description: Token revoked }
  /events/recent:
    get:
      operationId: listRecentEvents
      tags: [Operations]
      responses:
        '200': { $ref: '#/components/responses/EventList' }
  /events:
    get:
      operationId: streamEvents
      tags: [Operations]
      description: WebSocket endpoint that sends RelayEvent JSON messages after authentication.
      responses:
        '101': { description: WebSocket upgrade }

  /nodes:
    get:
      operationId: listClusterNodes
      tags: [Cluster]
      responses:
        '200': { $ref: '#/components/responses/NodeList' }
  /nodes/join-tokens:
    post:
      operationId: createNodeJoinToken
      tags: [Cluster]
      requestBody: { $ref: '#/components/requestBodies/CreateNodeJoinToken' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJoinToken' }
  /nodes/enroll:
    post:
      operationId: enrollNode
      tags: [Cluster]
      security: []
      requestBody: { $ref: '#/components/requestBodies/EnrollNode' }
      responses:
        '201': { $ref: '#/components/responses/EnrolledNode' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /nodes/connect:
    get:
      operationId: connectNodeAgent
      tags: [Cluster]
      description: Dedicated agent-listener WebSocket endpoint, normally on port 8100.
      security: [{ clusterNode: [] }]
      responses:
        '101': { description: Versioned bidirectional node-agent WebSocket }
  /nodes/{nodeId}:
    delete:
      operationId: removeNode
      tags: [Cluster]
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      responses:
        '204': { description: Node removed }
  /nodes/{nodeId}/drain:
    post:
      operationId: drainNode
      tags: [Cluster]
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      requestBody: { $ref: '#/components/requestBodies/DrainNode' }
      responses:
        '200': { $ref: '#/components/responses/Node' }
  /nodes/{nodeId}/certificate/rotate:
    post:
      operationId: rotateNodeCertificate
      tags: [Cluster]
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      requestBody: { $ref: '#/components/requestBodies/RotateCertificate' }
      responses:
        '200': { $ref: '#/components/responses/RotatedCertificate' }
  /nodes/{nodeId}/revoke:
    post:
      operationId: revokeNode
      tags: [Cluster]
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      responses:
        '200': { $ref: '#/components/responses/Node' }
  /nodes/{nodeId}/logs:
    get:
      operationId: listNodeLogs
      tags: [Cluster]
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      responses:
        '200': { $ref: '#/components/responses/LogList' }

  /provider-bindings:
    get:
      operationId: listProviderBindings
      tags: [Cluster]
      parameters:
        - { name: providerId, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/BindingList' }
    post:
      operationId: createProviderBinding
      tags: [Cluster]
      requestBody: { $ref: '#/components/requestBodies/CreateProviderBinding' }
      responses:
        '201': { $ref: '#/components/responses/CreatedBinding' }
  /provider-bindings/{bindingId}:
    delete:
      operationId: deleteProviderBinding
      tags: [Cluster]
      parameters:
        - { $ref: '#/components/parameters/BindingId' }
        - name: acknowledgeOrphanedCredential
          in: query
          description: >-
            Required to finalize cleanup when the bound node is already revoked and its local
            credential cannot be erased. Revoke or rotate the provider token before acknowledging.
          schema: { type: boolean, default: false }
      responses:
        '204':
          description: >-
            Binding deletion finalized after worker-confirmed credential removal or an explicit
            administrator acknowledgement that cleanup on a revoked or missing node is unverifiable.
        '409':
          description: Worker cleanup is unavailable or orphaned credential acknowledgement is required
  /placement/preview:
    post:
      operationId: previewPlacement
      tags: [Cluster]
      requestBody: { $ref: '#/components/requestBodies/PlacementPreview' }
      responses:
        '200': { $ref: '#/components/responses/PlacementPreview' }
  /jobs:
    get:
      operationId: listSegmentJobs
      tags: [Operations]
      responses:
        '200': { $ref: '#/components/responses/JobList' }
  /jobs/{jobId}:
    delete:
      operationId: cancelSegmentJob
      tags: [Operations]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '204': { description: Job cancelled }
  /jobs/{jobId}/retry:
    post:
      operationId: retrySegmentJob
      tags: [Operations]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { $ref: '#/components/responses/SegmentJobResult' }
  /backends:
    get:
      operationId: listBackendHealth
      tags: [Operations]
      responses:
        '200': { $ref: '#/components/responses/BackendList' }
  /backends/validate:
    post:
      operationId: validateBackend
      tags: [Operations]
      requestBody: { $ref: '#/components/requestBodies/ValidateBackend' }
      responses:
        '200': { $ref: '#/components/responses/Backend' }
  /backends/activate:
    post:
      operationId: activateBackend
      tags: [Operations]
      requestBody: { $ref: '#/components/requestBodies/ActivateBackend' }
      responses:
        '200': { $ref: '#/components/responses/Backend' }
  /cache:
    get:
      operationId: listCacheInventory
      tags: [Operations]
      responses:
        '200': { $ref: '#/components/responses/CacheList' }
    delete:
      operationId: evictCache
      tags: [Operations]
      requestBody: { $ref: '#/components/requestBodies/EvictCache' }
      responses:
        '200': { $ref: '#/components/responses/EvictionResult' }

components:
  securitySchemes:
    cookieSession: { type: apiKey, in: cookie, name: vrrelay_session }
    personalToken: { type: http, scheme: bearer }
    clusterNode:
      type: mutualTLS
      description: Seven-day rotating node certificate signed from a node-generated private key and CSR.
  parameters:
    ProviderId: { name: providerId, in: path, required: true, schema: { type: string } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
    ChannelId: { name: channelId, in: path, required: true, schema: { type: string } }
    TokenId: { name: tokenId, in: path, required: true, schema: { type: string } }
    NodeId: { name: nodeId, in: path, required: true, schema: { type: string } }
    BindingId: { name: bindingId, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string } }
  requestBodies:
    FirstRun:
      {
        required: true,
        content: { application/json: { schema: { $ref: '#/components/schemas/FirstRunRequest' } } }
      }
    Login:
      {
        required: true,
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      }
    CreateProvider:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreateProviderRequest' } } }
      }
    CreateProfileRevision:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CreateProfileRevisionRequest' } }
          }
      }
    CreateSession:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreateSessionRequest' } } }
      }
    ControlSession:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ControlSessionRequest' } } }
      }
    CreateLiveChannel:
      {
        required: true,
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/CreateLiveChannelRequest' } }
          }
      }
    CompatibilityResult:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CompatibilityInput' } } }
      }
    CreatePersonalToken:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CreatePersonalTokenRequest' } }
          }
      }
    CreateNodeJoinToken:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CreateNodeJoinTokenRequest' } }
          }
      }
    EnrollNode:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/EnrollNodeRequest' } } }
      }
    DrainNode:
      {
        required: true,
        content: { application/json: { schema: { $ref: '#/components/schemas/DrainNodeRequest' } } }
      }
    RotateCertificate:
      {
        required: false,
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/RotateCertificateRequest' } }
          }
      }
    CreateProviderBinding:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CreateProviderBindingRequest' } }
          }
      }
    PlacementPreview:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/PlacementPreviewRequest' } } }
      }
    ValidateBackend:
      required: true
      content:
        application/json: { schema: { $ref: '#/components/schemas/BackendValidationRequest' } }
    ActivateBackend:
      required: true
      content:
        application/json: { schema: { $ref: '#/components/schemas/BackendActivationRequest' } }
    EvictCache:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CacheEvictionRequest' } } }
      }
  responses:
    Error:
      {
        description: Request failed,
        content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
      }
    Health:
      {
        description: Health and worker capacity,
        content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
      }
    SetupStatus:
      {
        description: First-run state,
        content: { application/json: { schema: { $ref: '#/components/schemas/SetupStatus' } } }
      }
    AuthSession:
      {
        description: Authenticated browser session metadata,
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
      }
    Provider:
      {
        description: Provider without secret material,
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicProvider' } } }
      }
    ProviderList:
      {
        description: Provider connections,
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderList' } } }
      }
    Catalog:
      {
        description: Provider-neutral media page,
        content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPage' } } }
      }
    MediaItem:
      {
        description: Provider-neutral media item,
        content: { application/json: { schema: { $ref: '#/components/schemas/MediaItem' } } }
      }
    Profile:
      {
        description: Immutable profile revision,
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRevision' } } }
      }
    ProfileList:
      {
        description: Immutable profile revisions,
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileList' } } }
      }
    MediaCapabilities:
      {
        description: Discovered FFmpeg capabilities,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/MediaCapabilities' } } }
      }
    Session:
      {
        description: Relay session and opaque playback URLs,
        content: { application/json: { schema: { $ref: '#/components/schemas/RelaySession' } } }
      }
    SessionList:
      {
        description: Relay sessions,
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionList' } } }
      }
    LiveChannelList:
      {
        description: Live ingest channels without stored token hashes,
        content: { application/json: { schema: { $ref: '#/components/schemas/LiveChannelList' } } }
      }
    CreatedLiveChannel:
      {
        description: New channel and one-time publisher connection details,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreatedLiveChannel' } } }
      }
    Compatibility:
      {
        description: Compatibility evidence,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CompatibilityResult' } } }
      }
    CompatibilityList:
      {
        description: Compatibility evidence,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CompatibilityList' } } }
      }
    TokenList:
      {
        description: Personal tokens without token hashes or token material,
        content: { application/json: { schema: { $ref: '#/components/schemas/TokenList' } } }
      }
    CreatedToken:
      {
        description: Token material returned once,
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatedToken' } } }
      }
    EventList:
      {
        description: Recent events,
        content: { application/json: { schema: { $ref: '#/components/schemas/EventList' } } }
      }
    Node:
      {
        description: Cluster node,
        content: { application/json: { schema: { $ref: '#/components/schemas/ClusterNode' } } }
      }
    NodeList:
      {
        description: Cluster topology and agent state,
        content: { application/json: { schema: { $ref: '#/components/schemas/NodeList' } } }
      }
    CreatedJoinToken:
      {
        description: One-time enrollment token,
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatedJoinToken' } } }
      }
    EnrolledNode:
      {
        description: Node identity and signed certificate chain; node private keys never leave the node,
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrolledNode' } } }
      }
    RotatedCertificate:
      {
        description: New certificate expiry; replacement private keys remain on the node and only signed public certificate material travels over the agent channel,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [certificateExpiresAt],
                    properties: { certificateExpiresAt: { type: string, format: date-time } }
                  }
              }
          }
      }
    LogList:
      {
        description: Bounded redacted node logs,
        content: { application/json: { schema: { $ref: '#/components/schemas/LogList' } } }
      }
    BindingList:
      {
        description: Provider bindings without secret references,
        content: { application/json: { schema: { $ref: '#/components/schemas/BindingList' } } }
      }
    CreatedBinding:
      {
        description: Provider and node-local binding,
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatedBinding' } } }
      }
    PlacementPreview:
      {
        description: Selected node and placement reason,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [reason],
                    properties:
                      {
                        node:
                          {
                            anyOf: [{ $ref: '#/components/schemas/ClusterNode' }, { type: 'null' }]
                          },
                        reason: { type: string }
                      }
                  }
              }
          }
      }
    JobList:
      {
        description: Recent distributed segment jobs,
        content: { application/json: { schema: { $ref: '#/components/schemas/JobList' } } }
      }
    SegmentJobResult:
      {
        description: Retried distributed segment job,
        content: { application/json: { schema: { $ref: '#/components/schemas/SegmentJob' } } }
      }
    Backend:
      {
        description: Redacted backend health,
        content: { application/json: { schema: { $ref: '#/components/schemas/BackendStatus' } } }
      }
    BackendList:
      {
        description: Active backend health,
        content: { application/json: { schema: { $ref: '#/components/schemas/BackendList' } } }
      }
    CacheList:
      {
        description: Cache inventory without filesystem paths,
        content: { application/json: { schema: { $ref: '#/components/schemas/CacheList' } } }
      }
    EvictionResult:
      {
        description: Cache objects removed,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [removed],
                    properties: { removed: { type: integer, minimum: 0 } }
                  }
              }
          }
      }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
    Health:
      type: object
      required: [status, version, now, workers]
      properties:
        status: { const: ok }
        version: { type: string }
        now: { type: string, format: date-time }
        workers: { $ref: '#/components/schemas/WorkerCapacity' }
    WorkerCapacity:
      type: object
      required: [active, limit, queued]
      properties:
        active: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
    SetupStatus:
      {
        type: object,
        required: [configured, requiresToken],
        properties: { configured: { type: boolean }, requiresToken: { type: boolean } }
      }
    AuthSession:
      type: object
      required: [csrfToken, expiresAt]
      properties:
        csrfToken: { type: string }
