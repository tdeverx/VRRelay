                keychain,
                dpapi,
                encrypted-file,
                prometheus
              ]
          }
        endpoint: { type: string, format: uri }
        secretRef: { type: string, writeOnly: true }
        bucket: { type: string, minLength: 1, maxLength: 255 }
        container: { type: string, minLength: 1, maxLength: 255 }
        region: { type: string, minLength: 1, maxLength: 100 }
        prefix: { type: string, minLength: 1, maxLength: 500 }
        projectId: { type: string, minLength: 1, maxLength: 200 }
        forcePathStyle: { type: boolean }
        intervalSeconds: { type: integer, minimum: 5, maximum: 300 }
    BackendActivationRequest:
      allOf: [{ $ref: '#/components/schemas/BackendValidationRequest' }]
    BackendStatus:
      type: object
      required: [category, kind, healthy, checkedAt]
      properties:
        category:
          {
            type: string,
            enum: [object-store, coordination, repository, routing, secrets, metrics]
          }
        kind:
          {
            type: string,
            enum:
              [
                local,
                s3,
                azure-blob,
                gcs,
                postgres,
                valkey,
                builtin,
                webhook,
                sqlite,
                keychain,
                dpapi,
                encrypted-file,
                prometheus
              ]
          }
        healthy: { type: boolean }
        message: { type: string }
        checkedAt: { type: string, format: date-time }
        restartRequired: { type: boolean }
    BackendList:
      {
        type: object,
        required: [items, restartRequired],
        properties:
          {
            items: { type: array, items: { $ref: '#/components/schemas/BackendStatus' } },
            restartRequired: { type: boolean }
          }
      }
    CacheEvictionRequest:
      type: object
      minProperties: 1
      properties:
        all: { type: boolean }
        sessionId: { type: string }
        profileId: { type: string }
    CachedObject:
      type: object
      required: [key, size, contentType, expiresAt, createdAt, lastAccessedAt]
      properties:
        key: { type: string }
        size: { type: integer, minimum: 0 }
        contentType: { type: string }
        etag: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        expiresAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        lastAccessedAt: { type: string, format: date-time }
    CacheList:
      {
        type: object,
        required: [items, totalBytes],
        properties:
          {
            items: { type: array, items: { $ref: '#/components/schemas/CachedObject' } },
            totalBytes: { type: integer, minimum: 0 }
          }
      }
    AgentLogEntry:
      type: object
      required: [id, nodeId, level, message, context, timestamp]
      properties:
        id: { type: string }
        nodeId: { type: string }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }
        context: { type: object, additionalProperties: true }
        timestamp: { type: string, format: date-time }
    LogList:
      {
        type: object,
        required: [items],
        properties:
          { items: { type: array, items: { $ref: '#/components/schemas/AgentLogEntry' } } }
      }
