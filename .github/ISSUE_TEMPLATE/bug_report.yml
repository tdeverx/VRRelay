name: Bug report
description: Report a reproducible VRRelay defect
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, playback URLs, certificates, private source URLs, or unredacted logs. Report security issues through the private advisory flow.
  - type: textarea
    id: summary
    attributes: { label: Summary, description: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      { label: Reproduction steps, description: Provide the smallest repeatable sequence. }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Jellyfin VOD,
          OBS live,
          Cluster agents,
          Edge delivery,
          Dashboard,
          macOS,
          Windows,
          Docker Compose,
          Kubernetes,
          Other
        ]
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      {
        label: Environment,
        description: VRRelay commit/version,
        OS,
        role,
        FFmpeg/MediaMTX versions,
        deployment mode,
        VRChat platform/player if relevant.
      }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      { label: Redacted evidence, description: Error codes, minimal logs, or compatibility record. }
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed secrets and private URLs.
          required: true
        - label: This is not a security report.
          required: true
