name: Distributed acceptance
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - name: Install the pinned FFmpeg runtime
        run: |
          runtime_bin="$(script/install-pinned-ffmpeg-linux.sh "$RUNNER_TEMP/vrrelay-ffmpeg")"
          printf '%s\n' "$runtime_bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Run real-process distributed VOD smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run test:local-cluster 2>&1 | tee local-cluster.log
      - name: Run two-worker/two-edge acceptance harness
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee acceptance.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: distributed-acceptance-log
          path: |
            local-cluster.log
            acceptance.log
          if-no-files-found: ignore
