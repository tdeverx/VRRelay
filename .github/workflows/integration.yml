name: Distributed acceptance
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - name: Install the pinned FFmpeg runtime
        run: |
          runtime_bin="$(script/install-pinned-ffmpeg-linux.sh "$RUNNER_TEMP/vrrelay-ffmpeg")"
          printf '%s\n' "$runtime_bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify:distributed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: distributed-acceptance-log
          path: |
            local-cluster.log
            acceptance.log
          if-no-files-found: ignore
