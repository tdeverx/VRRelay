name: Cluster acceptance

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm
      - run: npm install --global npm@12.0.1
      - name: Install pinned FFmpeg
        run: |
          runtime_bin="$(script/install-pinned-ffmpeg-linux.sh "$RUNNER_TEMP/vrrelay-ffmpeg")"
          printf '%s\n' "$runtime_bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:cluster
