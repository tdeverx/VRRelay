name: Distributed acceptance
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.1', cache: npm }
      - run: npm ci
      - name: Run real-process distributed VOD smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run test:local-cluster 2>&1 | tee local-cluster.log
      - name: Run two-worker/two-edge acceptance harness
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee acceptance.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distributed-acceptance-log
          path: |
            local-cluster.log
            acceptance.log
          if-no-files-found: ignore
