name: Security and SBOM
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '17 4 * * 1' }]
permissions: { contents: read, security-events: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ., format: spdx-json, output-file: vrrelay.spdx.json }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: sbom, path: vrrelay.spdx.json }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          {
            scan-type: fs,
            scan-ref: .,
            format: sarif,
            output: trivy.sarif,
            severity: 'HIGH,CRITICAL',
            exit-code: '1'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: trivy-sarif, path: trivy.sarif, if-no-files-found: ignore }
      - uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: >-
          always() &&
          github.event.repository.private == false &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with: { sarif_file: trivy.sarif }
