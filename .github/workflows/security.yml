name: Security and SBOM
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '17 4 * * 1' }]
permissions: { contents: read, security-events: write }
env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.1', cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ., format: spdx-json, output-file: vrrelay.spdx.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: sbom, path: vrrelay.spdx.json }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          {
            scan-type: fs,
            scan-ref: .,
            format: sarif,
            output: trivy.sarif,
            severity: 'HIGH,CRITICAL',
            exit-code: '1'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: trivy-sarif, path: trivy.sarif, if-no-files-found: ignore }
      - uses: github/codeql-action/upload-sarif@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        if: >-
          always() &&
          github.event.repository.private == false &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with: { sarif_file: trivy.sarif }
