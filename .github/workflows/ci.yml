name: CI
on:
  push:
  pull_request:
permissions: { contents: read }
env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, macos-15, windows-latest], node: [22.23.1] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.1', cache: npm }
      - run: npm ci
      - run: npm run ci
  macos-host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: swift test --package-path apps/macos
      - run: swift build --package-path apps/macos -c release --arch arm64
      - name: Install pinned-FFmpeg build tools
        run: brew install autoconf automake libtool meson ninja pkg-config
      - name: Build and verify the pinned headless FFmpeg runtime
        run: |
          deploy/macos/build-ffmpeg.sh "$RUNNER_TEMP/vrrelay-ffmpeg"
          mkdir -p "$RUNNER_TEMP/vrrelay-ffmpeg/lib"
          deploy/macos/bundle-dylibs.sh "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" "$RUNNER_TEMP/vrrelay-ffmpeg/lib"
          "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" -hide_banner -encoders | grep -q h264_videotoolbox
          "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" -hide_banner -encoders | grep -q libx264
          "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" -hide_banner -filters | grep -q subtitles
          test -s "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg-build-metadata.json"
          test -s "$RUNNER_TEMP/vrrelay-ffmpeg/vrrelay-ffmpeg-7.1.5-darwin-arm64-source.tar.xz"
          node script/runtime-provenance.mjs --output "$RUNNER_TEMP/vrrelay-ffmpeg/provenance.json" "ffmpeg=$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.1', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: tmp/playwright-results/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: script/check-compose.sh
      - run: script/container-smoke.sh 0.0.0-ci
      - run: script/compose-smoke.sh
      - run: npm run test:cluster-compose
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with: { version: v4.2.3 }
      - run: script/check-workflows.sh
      - run: helm lint deploy/kubernetes
      - run: helm template vrrelay deploy/kubernetes > rendered.yaml
      - run: node script/check-kubernetes.mjs rendered.yaml
      - name: Reject shared node identities
        run: if helm template vrrelay deploy/kubernetes --set edge.replicas=2; then exit 1; fi
      - name: Verify staged controller bootstrap
        run: |
          helm template vrrelay deploy/kubernetes --set sourceWorker.enabled=false --set ingestOrigin.enabled=false --set edge.enabled=false > controller-only.yaml
          if grep -q vrrelay-mediamtx-origin controller-only.yaml; then exit 1; fi
