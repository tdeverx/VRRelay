name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, windows-latest], node: [26.5.0] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - if: runner.os == 'Linux'
        name: Install the pinned FFmpeg runtime
        run: |
          runtime_bin="$(script/install-pinned-ffmpeg-linux.sh "$RUNNER_TEMP/vrrelay-ffmpeg")"
          printf '%s\n' "$runtime_bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        name: Install the pinned FFmpeg runtime
        shell: pwsh
        run: |
          $runtimeBin = & script/install-pinned-ffmpeg-windows.ps1 "$env:RUNNER_TEMP\vrrelay-ffmpeg"
          $runtimeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run ci
  macos-host:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - name: Select the Swift 6.3 toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - run: swift test --package-path apps/macos
      - run: swift build --package-path apps/macos -c release --arch arm64
      - name: Install pinned-FFmpeg build tools
        run: brew install autoconf automake libtool meson ninja pkg-config
      - name: Build and verify the pinned headless FFmpeg runtime
        run: |
          deploy/macos/build-ffmpeg.sh "$RUNNER_TEMP/vrrelay-ffmpeg"
          mkdir -p "$RUNNER_TEMP/vrrelay-ffmpeg/lib"
          deploy/macos/bundle-dylibs.sh "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" "$RUNNER_TEMP/vrrelay-ffmpeg/lib"
          "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" -hide_banner -encoders | grep -q h264_videotoolbox
          "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" -hide_banner -encoders | grep -q libx264
          "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg" -hide_banner -filters | grep -q subtitles
          test -s "$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg-build-metadata.json"
          test -s "$RUNNER_TEMP/vrrelay-ffmpeg/vrrelay-ffmpeg-8.1.2-darwin-arm64-source.tar.xz"
          node script/runtime-provenance.mjs --output "$RUNNER_TEMP/vrrelay-ffmpeg/provenance.json" "ffmpeg=$RUNNER_TEMP/vrrelay-ffmpeg/ffmpeg"
          printf '%s\n' "$RUNNER_TEMP/vrrelay-ffmpeg" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run ci
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - name: Install the pinned FFmpeg runtime
        run: |
          runtime_bin="$(script/install-pinned-ffmpeg-linux.sh "$RUNNER_TEMP/vrrelay-ffmpeg")"
          printf '%s\n' "$runtime_bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure-artifacts
          path: tmp/playwright-results/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: script/check-compose.sh
      - run: script/container-smoke.sh 0.0.0-ci
      - run: script/compose-smoke.sh
      - run: npm run test:cluster-compose
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v4.2.3 }
      - run: script/check-workflows.sh
      - run: helm lint deploy/kubernetes
      - run: helm template vrrelay deploy/kubernetes > rendered.yaml
      - run: node script/check-kubernetes.mjs rendered.yaml
      - name: Reject shared node identities
        run: if helm template vrrelay deploy/kubernetes --set edge.replicas=2; then exit 1; fi
      - name: Verify staged controller bootstrap
        run: |
          helm template vrrelay deploy/kubernetes --set sourceWorker.enabled=false --set ingestOrigin.enabled=false --set edge.enabled=false > controller-only.yaml
          if grep -q vrrelay-mediamtx-origin controller-only.yaml; then exit 1; fi
