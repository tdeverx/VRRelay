name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-vrrelay-rolling-latest

  # actionlint 1.7.12 predates github's multi-run concurrency queue.
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.identity.outputs.version }}
      build_number: ${{ steps.build-number.outputs.build_number }}
      build_id: ${{ steps.identity.outputs.build_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm

      - name: Install pinned npm version
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Derive the next published product build number
        id: build-number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "build_number=$(node script/publish-rolling-release.mjs next-build-number)" \
            >> "$GITHUB_OUTPUT"

      - name: Validate the authoritative build identity
        id: identity
        env:
          VRRELAY_BUILD_NUMBER: ${{ steps.build-number.outputs.build_number }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"

          version="$(node -p "require('./package.json').version")"
          build_id="$(
            VRRELAY_VERSION="$version" \
              node script/publish-rolling-release.mjs identity
          )"

          {
            echo "version=$version"
            echo "build_id=$build_id"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

  security:
    needs:
      - gate

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-trivy-sarif
          path: trivy.sarif
          if-no-files-found: ignore
          overwrite: true

      - name: Upload Trivy results to GitHub code scanning
        if: >-
          always() &&
          github.event.repository.private == false &&
          hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy.sarif

  ffmpeg-source:
    needs:
      - gate

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'

      - name: Build and verify pinned FFmpeg corresponding source
        shell: bash
        run: |
          deploy/windows/build-corresponding-source.sh \
            "$RUNNER_TEMP/ffmpeg-btbn-corresponding-source.tar.xz"

      - name: Upload pinned FFmpeg corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-corresponding-source
          path: ${{ runner.temp }}/ffmpeg-btbn-corresponding-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  oci:
    needs:
      - gate
      - security

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}

    outputs:
      repository: ${{ steps.image.outputs.repository }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive OCI repository
        id: image
        shell: bash
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable OCI image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: >-
            type=image,
            name=${{ steps.image.outputs.repository }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
            io.vrrelay.build.id=${{ needs.gate.outputs.build_id }}
          build-args: |
            VRRELAY_VERSION=${{ needs.gate.outputs.version }}
          provenance: true
          sbom: true

      - name: Verify anonymous OCI access for a public repository
        if: github.event.repository.private == false
        shell: bash
        run: |
          docker logout ghcr.io

          docker buildx imagetools inspect \
            "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"

  native:
    needs:
      - gate
      - security
      - ffmpeg-source

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            artifact: macos

          - os: windows-latest
            artifact: windows

    runs-on: ${{ matrix.os }}

    env:
      VRRELAY_VERSION: ${{ needs.gate.outputs.version }}
      VRRELAY_BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      VRRELAY_BUILD_ID: ${{ needs.gate.outputs.build_id }}
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm

      - name: Install pinned npm version
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Select the Swift 6.3 toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select --switch /Applications/Xcode_26.6.app

          xcodebuild -version
          swift --version

      - name: Build VRRelay
        run: npm run build

      - name: Install pinned-FFmpeg build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            meson \
            ninja \
            pkg-config

      - name: Determine macOS packaging mode
        if: runner.os == 'macOS'
        id: macos-signing
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          signing_values=(
            "$APPLE_DEVELOPER_ID"
            "$APPLE_SIGNING_CERTIFICATE"
            "$APPLE_SIGNING_CERTIFICATE_PASSWORD"
            "$APPLE_KEYCHAIN_PASSWORD"
            "$APPLE_NOTARY_PROFILE"
            "$APPLE_NOTARY_KEY"
            "$APPLE_NOTARY_KEY_ID"
            "$APPLE_NOTARY_ISSUER_ID"
          )

          configured=0

          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -ne 0 && "$configured" -ne "${#signing_values[@]}" ]]; then
            echo "::error::macOS signing is only partially configured."
            echo "::error::provide every Apple signing secret or remove all Apple signing secrets."
            exit 1
          fi

          if [[ "$configured" -eq "${#signing_values[@]}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "VRRELAY_MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "macOS signed and notarised packaging enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VRRELAY_MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "Apple credentials are absent; macOS ad-hoc packaging enabled."
          fi

      - name: Import temporary Apple signing and notarisation credentials
        if: >-
          runner.os == 'macOS' &&
          steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          certificate="$RUNNER_TEMP/vrrelay-signing.p12"
          keychain="$RUNNER_TEMP/vrrelay-signing.keychain-db"
          notary_key="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"

          printf '%s' "$APPLE_SIGNING_CERTIFICATE" \
            | /usr/bin/base64 -D \
            > "$certificate"

          printf '%s' "$APPLE_NOTARY_KEY" \
            | /usr/bin/base64 -D \
            > "$notary_key"

          chmod 0600 "$certificate" "$notary_key"

          security create-keychain \
            -p "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain"

          security set-keychain-settings \
            -lut 21600 \
            "$keychain"

          security unlock-keychain \
            -p "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain"

          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain"

          security list-keychains \
            -d user \
            -s "$keychain" login.keychain-db

          security default-keychain \
            -d user \
            -s "$keychain"

          xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

      - name: Package signed and notarised macOS release
        if: >-
          runner.os == 'macOS' &&
          steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        env:
          VRRELAY_RELEASE_PACKAGING: '1'
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: deploy/macos/package.sh release dmg

      - name: Package ad-hoc macOS release
        if: >-
          runner.os == 'macOS' &&
          steps.macos-signing.outputs.enabled == 'false'
        shell: bash
        run: deploy/macos/package.sh release dmg

      - name: Remove temporary Apple credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/vrrelay-signing.keychain-db" \
            || true

          rm -f \
            "$RUNNER_TEMP/vrrelay-signing.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Download pinned FFmpeg corresponding-source bundle
        if: runner.os == 'Windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-corresponding-source
          path: ${{ runner.temp }}/ffmpeg-source

      - name: Verify pinned FFmpeg corresponding-source bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path `
            $env:RUNNER_TEMP `
            'ffmpeg-source\ffmpeg-btbn-corresponding-source.tar.xz'

          node script/windows-source-bundle.mjs --verify $bundle

          "VRRELAY_FFMPEG_SOURCE_BUNDLE=$bundle" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VRRELAY_RELEASE_PACKAGING: '1'
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: deploy/windows/package.ps1

      - name: Upload native release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrrelay-${{ matrix.artifact }}
          path: dist/VRRelay-${{ env.VRRELAY_BUILD_ID }}-*
          if-no-files-found: error
          overwrite: true

  release-metadata:
    needs:
      - gate
      - oci
      - ffmpeg-source

    runs-on: ubuntu-latest

    env:
      VRRELAY_VERSION: ${{ needs.gate.outputs.version }}
      VRRELAY_BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      VRRELAY_BUILD_ID: ${{ needs.gate.outputs.build_id }}
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}
      VRRELAY_OCI_REPOSITORY: ${{ needs.oci.outputs.repository }}
      VRRELAY_OCI_DIGEST: ${{ needs.oci.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm

      - name: Install pinned npm version
        run: npm install --global npm@12.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install dependencies
        run: npm ci

      - name: Prepare release metadata directory
        run: mkdir -p dist/release-metadata

      - name: Download pinned FFmpeg corresponding-source bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-corresponding-source
          path: ${{ runner.temp }}/ffmpeg-source

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release-metadata/vrrelay.spdx.json

      - name: Package Helm chart, source, and release notices
        shell: bash
        run: |
          release_chart="$RUNNER_TEMP/vrrelay-release-chart"

          cp -R deploy/kubernetes "$release_chart"

          node script/pin-release-chart.mjs \
            "$release_chart" \
            "$VRRELAY_OCI_REPOSITORY" \
            "$VRRELAY_OCI_DIGEST"

          helm template vrrelay "$release_chart" \
            > release-chart-rendered.yaml

          grep -F \
            "image: $VRRELAY_OCI_REPOSITORY@$VRRELAY_OCI_DIGEST" \
            release-chart-rendered.yaml

          node script/check-kubernetes.mjs \
            release-chart-rendered.yaml

          helm package "$release_chart" \
            --version "$VRRELAY_VERSION" \
            --app-version "$VRRELAY_VERSION" \
            --destination dist/release-metadata

          cp \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            deploy/runtime-manifest.json \
            docs/releasing.md \
            dist/release-metadata/

          ffmpeg_source_file="$(
            node -p "
              require('./deploy/runtime-manifest.json')
                .components
                .find((component) => component.name === 'ffmpeg')
                .artifacts
                .source
                .file
            "
          )"

          ffmpeg_source_url="$(
            node -p "
              require('./deploy/runtime-manifest.json')
                .components
                .find((component) => component.name === 'ffmpeg')
                .artifacts
                .source
                .url
            "
          )"

          [[ "$ffmpeg_source_file" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$ffmpeg_source_url" == https://* ]]

          curl \
            --fail \
            --location \
            "$ffmpeg_source_url" \
            --output "dist/release-metadata/$ffmpeg_source_file"

          node script/verify-runtime.mjs \
            "dist/release-metadata/$ffmpeg_source_file"

          btbn_source="dist/VRRelay-$VRRELAY_BUILD_ID-FFmpeg-BtbN-source.tar.xz"

          cp \
            "$RUNNER_TEMP/ffmpeg-source/ffmpeg-btbn-corresponding-source.tar.xz" \
            "$btbn_source"

          node script/windows-source-bundle.mjs \
            --verify "$btbn_source"

          (
            cd dist/release-metadata
            sha256sum ./* > SHA256SUMS
          )

          tar \
            -cJf "dist/VRRelay-$VRRELAY_BUILD_ID-release-metadata.tar.xz" \
            -C dist/release-metadata \
            .

          rm -rf dist/release-metadata

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrrelay-release-metadata
          path: dist/VRRelay-${{ env.VRRELAY_BUILD_ID }}-*
          if-no-files-found: error
          overwrite: true

  publish:
    needs:
      - gate
      - oci
      - native
      - release-metadata

    runs-on: ubuntu-latest

    env:
      VRRELAY_VERSION: ${{ needs.gate.outputs.version }}
      VRRELAY_BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      VRRELAY_BUILD_ID: ${{ needs.gate.outputs.build_id }}
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}
      VRRELAY_OCI_REPOSITORY: ${{ needs.oci.outputs.repository }}
      VRRELAY_OCI_DIGEST: ${{ needs.oci.outputs.digest }}

    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'

      - name: Download completed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: vrrelay-*
          merge-multiple: true

      - name: Prepare immutable build assets
        run: |
          node script/publish-rolling-release.mjs prepare artifacts

      - name: Attest completed build assets
        if: github.event.repository.private == false
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/*

      - name: Append build assets and advance latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node script/publish-rolling-release.mjs publish artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance OCI latest tag after release publication
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "$VRRELAY_OCI_REPOSITORY:latest" \
            "$VRRELAY_OCI_REPOSITORY@$VRRELAY_OCI_DIGEST"
