name: Release
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: vrrelay-rolling-latest
  # actionlint 1.7.12 predates GitHub's multi-run concurrency queue.
  queue: max
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build_number: ${{ steps.build-number.outputs.build_number }}
      build_id: ${{ steps.identity.outputs.build_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Derive the next published product build number
        id: build-number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "build_number=$(node script/publish-rolling-release.mjs next-build-number)" >> "$GITHUB_OUTPUT"
      - name: Validate the authoritative build identity
        id: identity
        env:
          VRRELAY_BUILD_NUMBER: ${{ steps.build-number.outputs.build_number }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version="$(node -p "require('./package.json').version")"
          build_id="$(VRRELAY_VERSION="$version" node script/publish-rolling-release.mjs identity)"
          {
            echo "version=$version"
            echo "build_id=$build_id"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
  security:
    needs: gate
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          {
            scan-type: fs,
            scan-ref: .,
            format: sarif,
            output: trivy.sarif,
            severity: 'HIGH,CRITICAL',
            exit-code: '1'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          {
            name: release-trivy-sarif,
            path: trivy.sarif,
            if-no-files-found: ignore,
            overwrite: true
          }
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always() && github.event.repository.private == false
        with: { sarif_file: trivy.sarif }
  oci:
    needs: [gate, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    env:
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
            io.vrrelay.build.id=${{ needs.gate.outputs.build_id }}
          build-args: VRRELAY_VERSION=${{ needs.gate.outputs.version }}
          provenance: true
          sbom: true
      - name: Verify anonymous OCI access for a public repository
        if: github.event.repository.private == false
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"
  native:
    needs: [gate, security]
    strategy:
      {
        matrix:
          {
            include: [{ os: macos-26, artifact: macos }, { os: windows-latest, artifact: windows }]
          }
      }
    runs-on: ${{ matrix.os }}
    env:
      VRRELAY_VERSION: ${{ needs.gate.outputs.version }}
      VRRELAY_BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      VRRELAY_BUILD_ID: ${{ needs.gate.outputs.build_id }}
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - if: runner.os == 'macOS'
        name: Select the Swift 6.3 toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app
      - run: npm run build
      - if: runner.os == 'macOS'
        name: Install pinned-FFmpeg build tools
        run: brew install autoconf automake libtool meson ninja pkg-config
      - if: runner.os == 'macOS'
        name: Import temporary Apple signing and notarization credentials
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$APPLE_SIGNING_CERTIFICATE"
          test -n "$APPLE_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$APPLE_KEYCHAIN_PASSWORD"
          test -n "$APPLE_NOTARY_PROFILE"
          test -n "$APPLE_NOTARY_KEY"
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
          certificate="$RUNNER_TEMP/vrrelay-signing.p12"
          keychain="$RUNNER_TEMP/vrrelay-signing.keychain-db"
          notary_key="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          printf '%s' "$APPLE_SIGNING_CERTIFICATE" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY" | /usr/bin/base64 -D > "$notary_key"
          chmod 0600 "$certificate" "$notary_key"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
            --key "$notary_key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
      - if: runner.os == 'macOS'
        env:
          VRRELAY_RELEASE_PACKAGING: '1'
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: deploy/macos/package.sh release dmg
      - if: always() && runner.os == 'macOS'
        name: Remove temporary Apple credentials
        run: |
          security delete-keychain "$RUNNER_TEMP/vrrelay-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/vrrelay-signing.p12" "$RUNNER_TEMP"/AuthKey_*.p8
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_SOURCE_BUNDLE_URL: ${{ vars.VRRELAY_FFMPEG_SOURCE_BUNDLE_URL }}
          FFMPEG_SOURCE_BUNDLE_SHA256: ${{ vars.VRRELAY_FFMPEG_SOURCE_BUNDLE_SHA256 }}
        run: |
          if (-not $env:FFMPEG_SOURCE_BUNDLE_URL) { throw 'VRRELAY_FFMPEG_SOURCE_BUNDLE_URL is required' }
          if (-not $env:FFMPEG_SOURCE_BUNDLE_SHA256) { throw 'VRRELAY_FFMPEG_SOURCE_BUNDLE_SHA256 is required' }
          $bundle = Join-Path $env:RUNNER_TEMP 'ffmpeg-btbn-corresponding-source.tar.xz'
          Invoke-WebRequest $env:FFMPEG_SOURCE_BUNDLE_URL -OutFile $bundle
          $actual = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SOURCE_BUNDLE_SHA256.ToLowerInvariant()) {
            throw "FFmpeg source bundle SHA-256 mismatch: $actual"
          }
          "VRRELAY_FFMPEG_SOURCE_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          VRRELAY_RELEASE_PACKAGING: '1'
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: deploy/windows/package.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrrelay-${{ matrix.artifact }}
          path: dist/VRRelay-${{ env.VRRELAY_BUILD_ID }}-*
          if-no-files-found: error
          overwrite: true
  release-metadata:
    needs: [gate, oci]
    runs-on: ubuntu-latest
    env:
      VRRELAY_VERSION: ${{ needs.gate.outputs.version }}
      VRRELAY_BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      VRRELAY_BUILD_ID: ${{ needs.gate.outputs.build_id }}
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}
      VRRELAY_OCI_REPOSITORY: ${{ needs.oci.outputs.repository }}
      VRRELAY_OCI_DIGEST: ${{ needs.oci.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0', cache: npm }
      - run: npm install --global npm@12.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v4.2.3 }
      - run: npm ci
      - run: mkdir -p dist/release-metadata
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: '.', format: spdx-json, output-file: dist/release-metadata/vrrelay.spdx.json }
      - name: Package Helm chart, source, and release notices
        env:
          FFMPEG_SOURCE_BUNDLE_URL: ${{ vars.VRRELAY_FFMPEG_SOURCE_BUNDLE_URL }}
          FFMPEG_SOURCE_BUNDLE_SHA256: ${{ vars.VRRELAY_FFMPEG_SOURCE_BUNDLE_SHA256 }}
        run: |
          release_chart="$RUNNER_TEMP/vrrelay-release-chart"
          cp -R deploy/kubernetes "$release_chart"
          node script/pin-release-chart.mjs "$release_chart" "$VRRELAY_OCI_REPOSITORY" "$VRRELAY_OCI_DIGEST"
          helm template vrrelay "$release_chart" > release-chart-rendered.yaml
          grep -F "image: $VRRELAY_OCI_REPOSITORY@$VRRELAY_OCI_DIGEST" release-chart-rendered.yaml
          node script/check-kubernetes.mjs release-chart-rendered.yaml
          helm package "$release_chart" --version "$VRRELAY_VERSION" --app-version "$VRRELAY_VERSION" --destination dist/release-metadata
          cp LICENSE THIRD_PARTY_NOTICES.md deploy/runtime-manifest.json docs/releasing.md dist/release-metadata/
          ffmpeg_source_file="$(node -p "require('./deploy/runtime-manifest.json').components.find((component) => component.name === 'ffmpeg').artifacts.source.file")"
          ffmpeg_source_url="$(node -p "require('./deploy/runtime-manifest.json').components.find((component) => component.name === 'ffmpeg').artifacts.source.url")"
          [[ "$ffmpeg_source_file" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$ffmpeg_source_url" == https://* ]]
          curl -fL "$ffmpeg_source_url" -o "dist/release-metadata/$ffmpeg_source_file"
          node script/verify-runtime.mjs "dist/release-metadata/$ffmpeg_source_file"
          test -n "$FFMPEG_SOURCE_BUNDLE_URL" && test -n "$FFMPEG_SOURCE_BUNDLE_SHA256"
          btbn_source="dist/VRRelay-$VRRELAY_BUILD_ID-FFmpeg-BtbN-source.tar.xz"
          curl -fL "$FFMPEG_SOURCE_BUNDLE_URL" -o "$btbn_source"
          echo "$FFMPEG_SOURCE_BUNDLE_SHA256  $btbn_source" | sha256sum --check --strict
          node script/windows-source-bundle.mjs --verify "$btbn_source"
          (cd dist/release-metadata && sha256sum ./* > SHA256SUMS)
          tar -cJf "dist/VRRelay-$VRRELAY_BUILD_ID-release-metadata.tar.xz" -C dist/release-metadata .
          rm -rf dist/release-metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrrelay-release-metadata
          path: dist/VRRelay-${{ env.VRRELAY_BUILD_ID }}-*
          if-no-files-found: error
          overwrite: true
  publish:
    needs: [gate, oci, native, release-metadata]
    runs-on: ubuntu-latest
    env:
      VRRELAY_VERSION: ${{ needs.gate.outputs.version }}
      VRRELAY_BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      VRRELAY_BUILD_ID: ${{ needs.gate.outputs.build_id }}
      VRRELAY_BUILD_RUN_ATTEMPT: ${{ needs.gate.outputs.run_attempt }}
      VRRELAY_OCI_REPOSITORY: ${{ needs.oci.outputs.repository }}
      VRRELAY_OCI_DIGEST: ${{ needs.oci.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26.5.0' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: 'vrrelay-*'
          merge-multiple: true
      - name: Prepare immutable build assets
        run: node script/publish-rolling-release.mjs prepare artifacts
      - name: Attest the completed build assets
        if: github.event.repository.private == false
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/*
      - name: Append build assets and advance latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node script/publish-rolling-release.mjs publish artifacts
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Advance the OCI latest tag after release publication
        run: |
          docker buildx imagetools create \
            --tag "$VRRELAY_OCI_REPOSITORY:latest" \
            "$VRRELAY_OCI_REPOSITORY@$VRRELAY_OCI_DIGEST"
